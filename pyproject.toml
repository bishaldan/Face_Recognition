[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faceproof"
version = "0.1.0"
description = "A Docker-first, privacy-aware face verification platform with a classic accessible web UI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.14.1",
  "boto3==1.36.26",
  "fastapi==0.115.8",
  "itsdangerous==2.2.0",
  "jinja2==3.1.5",
  "numpy==2.2.3",
  "onnxruntime==1.20.1",
  "opencv-python-headless==4.11.0.86",
  "pillow==11.1.0",
  "psycopg[binary]==3.2.5",
  "pydantic-settings==2.7.1",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.38",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.15.0",
  "pytest==8.3.4",
  "ruff==0.9.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic", "legacy", "models", "reports", "sample-data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true
exclude = ["alembic", "legacy"]
